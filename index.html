<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Overall Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#14f1c4;--blue:#3a8bff;
  --gold:#ffd166;--silver:#d4e2ff;--bronze:#ff9f5e;
  --text-1:#f4f9ff;--text-2:#9fc1e8;--text-3:#3f5c7a;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans TC',sans-serif;color:var(--text-1);min-height:100vh;overflow-x:hidden;background:#020a14}

/* ── BG ── */
.bg-canvas{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,rgba(58,139,255,.32) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 5%,rgba(20,241,196,.26) 0%,transparent 55%),
    radial-gradient(ellipse 70% 40% at 50% 100%,rgba(124,106,255,.2) 0%,transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%,#020d1c 40%,#010812 100%);
}
.bg-canvas::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 360px at 20% 35%,rgba(20,241,196,.14) 0%,transparent 70%),
             radial-gradient(circle 320px at 80% 65%,rgba(58,139,255,.16) 0%,transparent 70%);
  animation:blobdrift 18s ease-in-out infinite alternate}
@keyframes blobdrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,18px) scale(1.05)}}

/* ── LAYOUT ── */
.page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:2.5rem 2rem 8rem}

/* ── EDIT BTN ── */
.edit-corner-btn{
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  padding:10px 20px;border:none;cursor:pointer;
  border-radius:50px;font-family:inherit;font-size:13px;font-weight:600;
  letter-spacing:.06em;color:#fff;
  background:linear-gradient(135deg,var(--teal),var(--blue));
  box-shadow:0 4px 18px rgba(20,241,196,.28),0 2px 6px rgba(0,0,0,.3);
  transition:transform .15s,box-shadow .15s;
}
.edit-corner-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(20,241,196,.4)}
.edit-corner-btn:active{transform:scale(.97)}

/* ── HEADER ── */
.site-header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;margin-bottom:2.5rem;padding-top:.5rem}
.title-block{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.title-wrap{display:inline-flex;align-items:center;gap:10px;cursor:text;position:relative;max-width:100%}
.title-wrap:hover .title-hint{opacity:1}
.title-hint{flex-shrink:0;opacity:0;transition:opacity .2s;display:flex;cursor:pointer}
.title-hint svg{color:var(--text-3)}
#siteTitle{
  font-size:clamp(1.4rem,4vw,2.2rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(130deg,#eef4ff 20%,var(--teal) 75%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;outline:none;cursor:text;white-space:nowrap;
}
#siteTitle:focus{-webkit-text-fill-color:var(--text-1);background:none;color:var(--text-1)}
#siteTitle:empty:before{content:attr(data-placeholder);-webkit-text-fill-color:var(--text-3);background:none;color:var(--text-3)}
.header-accent{width:60px;height:3px;margin:.7rem 0 0;border-radius:2px;
  background:linear-gradient(90deg,var(--teal),var(--blue))}

/* ── RANK CARD ── */
.rank-card{
  background:linear-gradient(165deg,rgba(58,139,255,.1),rgba(20,241,196,.05));
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-xl);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 12px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
  padding:1.4rem 0 .4rem;
  overflow:hidden;
}

/* ── COLUMN HEADS ── */
.rank-col-head{
  display:grid;grid-template-columns:60px 1fr 2.5fr 110px;
  padding:0 1.4rem .35rem;
  font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-2);
  text-align:center;
}

/* ── ROWS ── */
.rank-list{position:relative}

.rank-row{
  display:grid;grid-template-columns:60px 1fr 2.5fr 110px;
  align-items:center;
  padding:0 1.4rem;
  border-bottom:1px solid rgba(255,255,255,.07);
  cursor:pointer;
  transition:background .15s;
  position:relative;
}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:rgba(58,139,255,.07)}
.rank-row.active-row{background:rgba(20,241,196,.1);box-shadow:inset 3px 0 0 var(--teal)}

/* badge */
.cell-rank{display:flex;align-items:center;justify-content:center;padding:.9rem .5rem}
.rank-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.rb-gold  {background:linear-gradient(135deg,rgba(255,209,102,.4),rgba(255,209,102,.12));color:var(--gold);box-shadow:0 0 16px rgba(255,209,102,.35)}
.rb-silver{background:linear-gradient(135deg,rgba(212,226,255,.35),rgba(212,226,255,.1));color:var(--silver);box-shadow:0 0 14px rgba(212,226,255,.2)}
.rb-bronze{background:linear-gradient(135deg,rgba(255,159,94,.4),rgba(255,159,94,.12));color:var(--bronze);box-shadow:0 0 14px rgba(255,159,94,.3)}
.rb-other {background:rgba(255,255,255,.06);color:var(--text-2)}

/* name */
.cell-name{padding:.9rem .5rem;font-size:19px;font-weight:700;color:var(--text-1);text-align:center}

/* scores */
.cell-scores{padding:.9rem .5rem;overflow:hidden}
.score-group{display:flex;flex-wrap:nowrap;justify-content:flex-start;align-items:center;overflow-x:auto;scrollbar-width:none}
.score-group::-webkit-scrollbar{display:none}
.score-item{display:flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:38px;padding:0 14px;border-right:1px solid rgba(255,255,255,.08)}
.score-item:last-child{border-right:none}
.score-val{font-size:17px;font-weight:600;color:var(--text-1)}
.score-val.empty{color:var(--text-3)}

/* avg */
.cell-avg{padding:.9rem 1rem;text-align:center}
.avg-num{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.avg-num.zero{font-size:20px;-webkit-text-fill-color:var(--text-3);background:none;color:var(--text-3)}
.avg-denom{font-size:12px;color:var(--text-3);-webkit-text-fill-color:var(--text-3)}

/* empty */
.rank-empty{text-align:center;padding:4rem 2rem;color:var(--text-3);font-size:15px;letter-spacing:.06em}

/* ── BOTTOM SHEET ── */
.sheet-overlay{
  position:fixed;inset:0;z-index:40;
  background:transparent;
  opacity:0;pointer-events:none;transition:opacity .1s;
}
.sheet-overlay.open{opacity:1;pointer-events:all}

.bottom-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:rgba(3,16,34,.92);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  box-shadow:0 -4px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.25,.8,.25,1);
  max-height:60vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent;
}
.bottom-sheet.open{transform:translateY(0)}

.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:14px auto 0}

.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.8rem .8rem;
}
.sheet-athlete-info{display:flex;align-items:center;gap:14px}
.sheet-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.sheet-name{font-size:20px;font-weight:700;color:var(--text-1)}
.sheet-rank-label{font-size:12px;color:var(--text-2);margin-top:2px}
.sheet-close{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.sheet-close:hover{background:rgba(255,255,255,.15);color:var(--text-1)}

.sheet-body{padding:0 1.8rem 1.6rem;display:flex;align-items:stretch;gap:14px}

/* score input row */
.score-input-row{display:flex;gap:12px;flex:1;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent}
.score-field{display:flex;flex-direction:column;gap:6px;flex:0 0 86px}
.score-field-label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-field-input{
  background:rgba(255,255,255,.07);border:none;border-radius:var(--r-md);
  padding:13px 10px;color:var(--text-1);font-size:17px;font-weight:500;
  outline:none;font-family:inherit;text-align:center;
  transition:background .15s;width:100%;
}
.score-field-input:focus{background:rgba(255,255,255,.12);color:var(--teal)}
.score-field-input::placeholder{color:var(--text-3)}

.submit-btn{
  flex:0 0 auto;align-self:center;border:none;border-radius:var(--r-lg);padding:16px 28px;
  color:#022019;font-size:15px;font-weight:800;letter-spacing:.06em;white-space:nowrap;
  cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--teal),var(--blue));
  box-shadow:0 4px 22px rgba(20,241,196,.35);
  transition:opacity .15s,transform .1s;
}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}

/* ── MANAGE PANEL (right slide) ── */
.panel-overlay{position:fixed;inset:0;z-index:55;background:rgba(1,8,20,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s}
.panel-overlay.open{opacity:1;pointer-events:all}
.slide-panel{
  position:fixed;right:0;top:0;bottom:0;z-index:60;
  width:min(460px,100vw);
  background:rgba(3,14,30,.92);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  box-shadow:-6px 0 60px rgba(0,0,0,.6),inset 1px 0 0 rgba(255,255,255,.06);
  transform:translateX(100%);transition:transform .32s cubic-bezier(.25,.8,.25,1);
  overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent;
}
.slide-panel.open{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:2rem 2rem 1.6rem;position:sticky;top:0;background:rgba(3,14,30,.95);backdrop-filter:blur(20px);z-index:2}
.panel-head h2{font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--text-1)}
.panel-close{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;transition:background .15s,color .15s}
.panel-close:hover{background:rgba(255,255,255,.15);color:var(--text-1)}
.panel-body{padding:1.4rem 2rem 2.5rem;flex:1;display:flex;flex-direction:column;gap:2.4rem}
.panel-sec-head{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:1rem}
.edit-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:hidden;max-height:140px;transition:max-height .35s ease}
.edit-list.expanded{max-height:1200px}
.edit-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:var(--r-md);padding:11px 12px;min-width:0}
.edit-item-icon{color:var(--text-3);flex-shrink:0;display:flex}
.edit-item-input{flex:1;background:none;border:none;outline:none;color:var(--text-1);font-size:14px;font-family:inherit;min-width:0}
.edit-item-input::placeholder{color:var(--text-3)}
.edit-item-input:focus{color:var(--teal)}
.toggle-list-btn{margin-top:10px;width:100%;background:none;border:1px dashed rgba(255,255,255,.15);border-radius:var(--r-md);padding:9px;color:var(--text-2);font-size:12px;letter-spacing:.1em;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.toggle-list-btn:hover{background:rgba(255,255,255,.05);color:var(--text-1)}
.panel-sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.panel-sec-row .panel-sec-head{margin-bottom:0}
.stepper{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:50px;padding:5px 8px}
.stepper button{width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--text-1);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit}
.stepper button:hover{background:rgba(255,255,255,.18)}
.stepper span{font-size:14px;font-weight:700;min-width:18px;text-align:center;color:var(--text-1)}
.export-row{display:flex;gap:10px}
.export-row .add-row-btn{flex:1;margin-top:0}
.add-row-btn{margin-top:10px;width:100%;background:rgba(20,241,196,.1);border:none;border-radius:var(--r-md);padding:12px;color:var(--teal);font-size:14px;letter-spacing:.08em;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s}
.add-row-btn:hover{background:rgba(20,241,196,.18)}
.divider{height:1px;background:rgba(255,255,255,.05)}

/* responsive */
@media(max-width:640px){
  .page{padding:2rem 1rem 8rem}
  .rank-col-head,.rank-row{grid-template-columns:50px 1fr 100px}
  .rch-scores,.cell-scores{display:none}
  .site-header{align-items:flex-start;gap:.8rem}
  .edit-corner-btn{padding:8px 14px;font-size:11px}
  .score-field{flex:0 0 78px}
  .sheet-body{padding:0 1rem 1.4rem;gap:10px}
  .submit-btn{padding:14px 18px}
}
@media(max-width:400px){.slide-panel{width:100vw}}
</style>
</head>
<body>
<div class="bg-canvas"></div>

<!-- EDIT BTN -->
<div class="page">
  <!-- HEADER -->
  <header class="site-header">
    <div class="title-block">
      <div class="title-wrap">
        <h1 id="siteTitle" contenteditable="true" spellcheck="false" data-placeholder="Overall Rankings">Overall Rankings</h1>
        <span class="title-hint" onclick="focusTitle()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </span>
      </div>
      <div class="header-accent"></div>
    </div>
    <button class="edit-corner-btn" id="editBtn" onclick="openPanel()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      人員設定
    </button>
  </header>

  <!-- RANKING -->
  <div class="rank-card">
    <div class="rank-col-head">
      <div class="rch-rank">排名</div>
      <div>選手</div>
      <div class="rch-scores">評審分數</div>
      <div class="rch-avg">平均分數</div>
    </div>
    <div class="rank-list" id="rankList"></div>
  </div>
</div>

<!-- BOTTOM SHEET OVERLAY -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<!-- BOTTOM SHEET -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-athlete-info">
      <div class="sheet-badge" id="sheetBadge"></div>
      <div>
        <div class="sheet-name" id="sheetName"></div>
        <div class="sheet-rank-label" id="sheetRankLabel"></div>
      </div>
    </div>
    <button class="sheet-close" onclick="closeSheet()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="score-input-row" id="sheetScoreGrid"></div>
    <button class="submit-btn" onclick="submitScores()">提交</button>
  </div>
</div>

<!-- MANAGE PANEL OVERLAY -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<!-- MANAGE PANEL -->
<div class="slide-panel" id="slidePanel">
  <div class="panel-head">
    <h2>人員設定</h2>
    <button class="panel-close" onclick="closePanel()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div>
      <div class="panel-sec-row">
        <p class="panel-sec-head">選手列表</p>
        <div class="stepper">
          <button onclick="adjustAthletes(-1)">−</button>
          <span id="athleteCount">10</span>
          <button onclick="adjustAthletes(1)">＋</button>
        </div>
      </div>
      <div class="edit-list" id="athleteEditList"></div>
      <button class="toggle-list-btn" id="athleteToggle" onclick="toggleList('athlete')" style="display:none"></button>
    </div>
    <div class="divider"></div>
    <div>
      <div class="panel-sec-row">
        <p class="panel-sec-head">評審列表</p>
        <div class="stepper">
          <button onclick="adjustJudges(-1)">−</button>
          <span id="judgeCount">10</span>
          <button onclick="adjustJudges(1)">＋</button>
        </div>
      </div>
      <div class="edit-list" id="judgeEditList"></div>
      <button class="toggle-list-btn" id="judgeToggle" onclick="toggleList('judge')" style="display:none"></button>
    </div>
    <div class="divider"></div>
    <div>
      <p class="panel-sec-head">匯出</p>
      <div class="export-row">
        <button class="add-row-btn" onclick="exportHTML()">匯出 HTML</button>
        <button class="add-row-btn" onclick="exportJPG()">匯出 JPG</button>
      </div>
    </div>
  </div>
</div>

<script>
let judges = ['評審 1','評審 2','評審 3','評審 4','評審 5','評審 6','評審 7','評審 8','評審 9','評審 10'];
let athletes = Array.from({length:10},(_,i)=>({id:i+1,name:'EPM '+(i+1),scores:Array(10).fill(null)}));
let nextId = 11;
let activeSheetId = null;

function avg(s){
  const valid=s.filter(x=>x!==null&&x!==undefined);
  return valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
}

/* title */
function focusTitle(){
  const t=document.getElementById('siteTitle');
  t.focus();
  const range=document.createRange();
  range.selectNodeContents(t);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
document.getElementById('siteTitle').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault();});
document.getElementById('siteTitle').addEventListener('paste',e=>{
  e.preventDefault();
  document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text').replace(/\n/g,' '));
});

/* render ranking */
function rankLabel(r){return r===1?'1st Place':r===2?'2nd Place':r===3?'3rd Place':`${r}th Place`}
function badgeCls(r){return r===1?'rb-gold':r===2?'rb-silver':r===3?'rb-bronze':'rb-other'}

function renderRanking(){
  const sorted=[...athletes].sort((a,b)=>{
    const aa=avg(a.scores),ba=avg(b.scores);
    if(aa===null&&ba===null) return a.id-b.id;
    if(aa===null) return 1;
    if(ba===null) return -1;
    return ba-aa;
  });
  const list=document.getElementById('rankList');
  if(!sorted.length){list.innerHTML='<div class="rank-empty">尚未新增選手</div>';return;}
  list.innerHTML=sorted.map((a,i)=>{
    const r=i+1;
    const bc=badgeCls(r);
    const av=avg(a.scores);
    const isActive=activeSheetId===a.id;
    const scoreItems=a.scores.map((sc,j)=>`
      <div class="score-item">
        <span class="score-val${sc===null||sc===undefined?' empty':''}">${sc!==null&&sc!==undefined?sc.toFixed(1):'—'}</span>
      </div>`).join('');
    const avgHtml=av!==null
      ?`<span class="avg-num">${av.toFixed(2)}</span><span class="avg-denom"> / 10</span>`
      :`<span class="avg-num zero">—</span>`;
    return `
    <div class="rank-row${isActive?' active-row':''}" id="row_${a.id}" onclick="openSheet(${a.id})">
      <div class="cell-rank"><div class="rank-badge ${bc}">${r}</div></div>
      <div class="cell-name">${a.name}</div>
      <div class="cell-scores"><div class="score-group">${scoreItems}</div></div>
      <div class="cell-avg">${avgHtml}</div>
    </div>`;
  }).join('');
}

/* bottom sheet */
function openSheet(id){
  if(activeSheetId===id){closeSheet();return;}
  activeSheetId=id;
  const a=athletes.find(x=>x.id===id);
  const sorted=[...athletes].sort((a,b)=>{const aa=avg(a.scores),ba=avg(b.scores);if(aa===null&&ba===null)return a.id-b.id;if(aa===null)return 1;if(ba===null)return -1;return ba-aa;});
  const r=sorted.findIndex(x=>x.id===id)+1;
  const bc=badgeCls(r);

  // badge styling
  const badgeEl=document.getElementById('sheetBadge');
  badgeEl.className='sheet-badge '+bc;
  badgeEl.textContent=r;
  document.getElementById('sheetName').textContent=a.name;
  document.getElementById('sheetRankLabel').textContent=rankLabel(r);

  // score inputs
  document.getElementById('sheetScoreGrid').innerHTML=judges.map((j,i)=>`
    <div class="score-field">
      <span class="score-field-label">${j}</span>
      <input class="score-field-input" id="sf_${i}" type="number"
        value="${a.scores[i]!==null&&a.scores[i]!==undefined?a.scores[i]:''}"
        placeholder="0.0" min="0" max="10" step="0.1"/>
    </div>`).join('');

  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
  renderRanking();
}
function closeSheet(){
  activeSheetId=null;
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
  renderRanking();
}
function submitScores(){
  const a=athletes.find(x=>x.id===activeSheetId);
  if(!a) return;
  judges.forEach((_,i)=>{
    const el=document.getElementById('sf_'+i);
    if(!el) return;
    const raw=el.value.trim();
    if(raw===''){a.scores[i]=null;}
    else{const v=parseFloat(raw);a.scores[i]=isNaN(v)?null:Math.min(10,Math.max(0,v));}
  });
  closeSheet();
}

/* manage panel */
let panelOpen=false;
function openPanel(){
  panelOpen=true;
  document.getElementById('slidePanel').classList.add('open');
  document.getElementById('panelOverlay').classList.add('open');
  renderPanel();
}
function closePanel(){
  panelOpen=false;
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('panelOverlay').classList.remove('open');
}

function renderPanel(){
  document.getElementById('judgeCount').textContent=judges.length;
  document.getElementById('athleteCount').textContent=athletes.length;
  document.getElementById('judgeEditList').innerHTML=judges.map((j,i)=>`
    <div class="edit-item">
      <span class="edit-item-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      <input class="edit-item-input" value="${j}" placeholder="評審名稱" onchange="renameJudge(${i},this.value)"/>
    </div>`).join('');
  document.getElementById('athleteEditList').innerHTML=athletes.map(a=>`
    <div class="edit-item">
      <span class="edit-item-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
      <input class="edit-item-input" value="${a.name}" placeholder="選手姓名" onchange="renameAthlete(${a.id},this.value)"/>
    </div>`).join('');

  updateListCollapse('athlete',athletes.length);
  updateListCollapse('judge',judges.length);
}

function updateListCollapse(type,count){
  const list=document.getElementById(type+'EditList');
  const btn=document.getElementById(type+'Toggle');
  if(count>6){
    btn.style.display='block';
    btn.textContent=list.classList.contains('expanded')?'收合列表':'顯示完整列表';
  }else{
    btn.style.display='none';
    list.classList.remove('expanded');
  }
}
function toggleList(type){
  const list=document.getElementById(type+'EditList');
  list.classList.toggle('expanded');
  const count=type==='athlete'?athletes.length:judges.length;
  updateListCollapse(type,count);
}

function renameJudge(i,v){if(v.trim())judges[i]=v.trim();renderRanking();}
function renameAthlete(id,v){const a=athletes.find(x=>x.id===id);if(a&&v.trim())a.name=v.trim();renderRanking();}

function adjustJudges(delta){
  if(delta>0){
    judges.push('評審 '+(judges.length+1));
    athletes.forEach(a=>a.scores.push(null));
  }else{
    if(judges.length<=1){alert('至少需要一位評審');return;}
    judges.pop();
    athletes.forEach(a=>a.scores.pop());
  }
  renderRanking();renderPanel();
}
function adjustAthletes(delta){
  if(delta>0){
    athletes.push({id:nextId++,name:'EPM '+(athletes.length+1),scores:judges.map(()=>null)});
  }else{
    if(athletes.length<=1){alert('至少需要一位選手');return;}
    const removed=athletes.pop();
    if(activeSheetId===removed.id) closeSheet();
  }
  renderRanking();renderPanel();
}

/* ── EXPORT ── */
function exportHTML(){
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  html=html.replace(/let judges = \[[^\]]*\];/,'let judges = '+JSON.stringify(judges)+';');
  html=html.replace(/let athletes = .*?;(\s*\nlet nextId)/s,'let athletes = '+JSON.stringify(athletes)+';$1');
  html=html.replace(/let nextId = \d+;/,'let nextId = '+nextId+';');
  html=html.replace(/class="sheet-overlay open" id="sheetOverlay"/,'class="sheet-overlay" id="sheetOverlay"');
  html=html.replace(/class="bottom-sheet open" id="bottomSheet"/,'class="bottom-sheet" id="bottomSheet"');
  html=html.replace(/class="panel-overlay open" id="panelOverlay"/,'class="panel-overlay" id="panelOverlay"');
  html=html.replace(/class="slide-panel open" id="slidePanel"/,'class="slide-panel" id="slidePanel"');

  const blob=new Blob([html],{type:'text/html'});
  const link=document.createElement('a');
  link.download=(document.getElementById('siteTitle').textContent.trim()||'ranking')+'.html';
  link.href=URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){resolve();return;}
    const s=document.createElement('script');
    s.src=src;s.onload=resolve;s.onerror=reject;
    document.head.appendChild(s);
  });
}
async function exportJPG(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  closePanel();closeSheet();
  setTimeout(async()=>{
    const canvas=await html2canvas(document.body,{backgroundColor:'#020a14',scale:2});
    const link=document.createElement('a');
    link.download=(document.getElementById('siteTitle').textContent.trim()||'ranking')+'.jpg';
    link.href=canvas.toDataURL('image/jpeg',0.95);
    link.click();
  },350);
}

renderRanking();
