<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Overall Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#14f1c4;--blue:#3a8bff;
  --gold:#ffd166;--silver:#d4e2ff;--bronze:#ff9f5e;
  --text-1:#f4f9ff;--text-2:#9fc1e8;--text-3:#4a6a8a;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --bar-h:80px;
  --bg-body:#020a14;
  --bg-card:rgba(58,139,255,.1);
  --bg-card2:rgba(20,241,196,.05);
  --border-card:rgba(255,255,255,.1);
  --fade-color:2,10,20;
}
[data-theme="light"]{
  --text-1:#0d1f35;--text-2:#1e3d5c;--text-3:#5a82aa;
  --bg-body:#ddeaf8;
  --bg-card:rgba(58,139,255,.07);
  --bg-card2:rgba(20,241,196,.04);
  --border-card:rgba(58,139,255,.2);
  --fade-color:221,234,248;
}

html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans TC',sans-serif;color:var(--text-1);min-height:100vh;overflow-x:hidden;background:var(--bg-body);transition:background .3s,color .3s}

/* BG */
.bg-canvas{position:fixed;inset:0;z-index:0}
[data-theme="dark"] .bg-canvas,.bg-canvas{
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,rgba(58,139,255,.32) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 5%,rgba(20,241,196,.26) 0%,transparent 55%),
    radial-gradient(ellipse 70% 40% at 50% 100%,rgba(124,106,255,.2) 0%,transparent 60%),
    #020d1c;
}
[data-theme="light"] .bg-canvas{
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,rgba(58,139,255,.14) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 5%,rgba(20,241,196,.12) 0%,transparent 55%),
    #ddeaf8;
}
.bg-canvas::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 360px at 20% 35%,rgba(20,241,196,.14) 0%,transparent 70%),
             radial-gradient(circle 320px at 80% 65%,rgba(58,139,255,.16) 0%,transparent 70%);
  animation:blobdrift 18s ease-in-out infinite alternate}
@keyframes blobdrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,18px) scale(1.05)}}

/* LAYOUT */
.page{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:2.5rem 2rem;padding-bottom:calc(var(--bar-h) + 3rem)}

/* HEADER */
.site-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2rem;padding-top:.5rem}
.title-block{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.title-wrap{display:inline-flex;align-items:center;gap:10px;max-width:100%}
.title-wrap:hover .title-hint{opacity:1}
.title-hint{flex-shrink:0;opacity:0;transition:opacity .2s;display:flex;cursor:pointer}
.title-hint svg{color:var(--text-3)}
#siteTitle{
  font-size:clamp(1.4rem,4vw,2.2rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(130deg,#eef4ff 20%,var(--teal) 75%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;outline:none;cursor:text;white-space:nowrap;
}
[data-theme="light"] #siteTitle{background:linear-gradient(130deg,#0d1f35 20%,#0a8a6e 75%,#1a5bbb 100%);-webkit-background-clip:text;background-clip:text}
#siteTitle:focus{-webkit-text-fill-color:var(--text-1);background:none;color:var(--text-1)}
#siteTitle:empty:before{content:attr(data-placeholder);-webkit-text-fill-color:var(--text-3);background:none}
.header-accent{width:60px;height:3px;margin:.7rem 0 0;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}

.icon-btn{
  width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:background .15s,color .15s;
}
[data-theme="light"] .icon-btn{border-color:rgba(0,0,0,.12);background:rgba(0,0,0,.05);color:var(--text-2)}
.icon-btn:hover{background:rgba(255,255,255,.16);color:var(--text-1)}
[data-theme="light"] .icon-btn:hover{background:rgba(0,0,0,.1)}

.settle-btn{
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  padding:10px 22px;border:none;cursor:pointer;border-radius:50px;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;color:#022019;
  background:linear-gradient(135deg,var(--gold),var(--bronze));
  box-shadow:0 4px 18px rgba(255,209,102,.3),0 2px 6px rgba(0,0,0,.3);
  transition:transform .15s,box-shadow .15s;
}
.settle-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,209,102,.4)}
.settle-btn:active{transform:scale(.97)}

/* GLASS CARD */
.glass-card{
  background:linear-gradient(165deg,var(--bg-card),var(--bg-card2));
  border:1px solid var(--border-card);border-radius:var(--r-xl);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 12px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
}
.rank-card{padding:1.1rem 0 .4rem;overflow:hidden}

/* COLUMN HEADS */
.rank-col-head{
  display:grid;grid-template-columns:52px 1fr 4fr 110px;
  padding:0 1.4rem .3rem;
  font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-2);
}
.rank-col-head>div:first-child{text-align:center}
.rank-col-head>div:last-child{text-align:center}

/* ROWS */
.rank-list{position:relative}
.rank-row{
  display:grid;grid-template-columns:52px 1fr 4fr 110px;
  align-items:center;padding:0 1.4rem;
  border-bottom:1px solid rgba(255,255,255,.07);
}
[data-theme="light"] .rank-row{border-bottom-color:rgba(0,0,0,.07)}
.rank-row:last-child{border-bottom:none}

/* row animations */
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes swapPulse{0%,100%{background:transparent}40%{background:rgba(20,241,196,.08)}}
.row-anim-up{animation:slideUp .36s cubic-bezier(.34,1.56,.64,1) both}
.row-anim-down{animation:slideDown .36s cubic-bezier(.34,1.56,.64,1) both}
.row-anim-swap{animation:swapPulse .4s ease both}

/* badge */
.cell-rank{display:flex;align-items:center;justify-content:center;padding:.55rem .2rem}
.rank-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.rb-empty{background:rgba(255,255,255,.05);color:var(--text-3)}
[data-theme="light"] .rb-empty{background:rgba(0,0,0,.06)}
.rb-gold  {background:linear-gradient(135deg,rgba(255,209,102,.4),rgba(255,209,102,.12));color:var(--gold);box-shadow:0 0 16px rgba(255,209,102,.35)}
.rb-silver{background:linear-gradient(135deg,rgba(212,226,255,.35),rgba(212,226,255,.1));color:var(--silver);box-shadow:0 0 14px rgba(212,226,255,.2)}
.rb-bronze{background:linear-gradient(135deg,rgba(255,159,94,.4),rgba(255,159,94,.12));color:var(--bronze);box-shadow:0 0 14px rgba(255,159,94,.3)}
.rb-other {background:rgba(255,255,255,.06);color:var(--text-2)}
[data-theme="light"] .rb-other{background:rgba(0,0,0,.06)}

/* name — left-aligned */
.cell-name{padding:.55rem .4rem;font-size:18px;font-weight:700;color:var(--text-1);text-align:left}

/* scores */
.cell-scores{padding:.45rem .5rem;overflow:hidden}
.score-group{display:flex;flex-wrap:nowrap;align-items:center;overflow-x:auto;scrollbar-width:none}
.score-group::-webkit-scrollbar{display:none}
.score-item{
  display:flex;align-items:center;justify-content:center;
  flex:1 1 0;min-width:34px;max-width:56px;padding:4px 5px;
  border-right:1px solid rgba(255,255,255,.08);
}
[data-theme="light"] .score-item{border-right-color:rgba(0,0,0,.08)}
.score-item:last-child{border-right:none}
.score-item.trimmed .score-val{color:var(--text-3);text-decoration:line-through;text-decoration-color:rgba(255,159,94,.6)}
.score-val{font-size:14px;font-weight:600;color:var(--text-1);white-space:nowrap;display:block;text-align:center;width:100%}
.score-val.empty{color:var(--text-3)}

/* avg */
.cell-avg{padding:.55rem 1rem;text-align:center;white-space:nowrap}
.avg-num{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.avg-num.zero{font-size:20px;font-weight:600;-webkit-text-fill-color:var(--text-3);background:none;color:var(--text-3)}
.avg-denom{font-size:11px;color:var(--text-3);-webkit-text-fill-color:var(--text-3)}
.rank-empty{text-align:center;padding:4rem 2rem;color:var(--text-3);font-size:15px}

/* SETTINGS MODAL */
.settings-overlay{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.settings-overlay.open{opacity:1;pointer-events:all}
.settings-card{
  background:linear-gradient(160deg,rgba(6,16,38,.97),rgba(2,10,24,.98));
  border:1px solid rgba(255,255,255,.14);border-radius:var(--r-xl);
  padding:2rem;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent;
}
[data-theme="light"] .settings-card{
  background:linear-gradient(160deg,rgba(240,248,255,.98),rgba(225,238,255,.99));
  border-color:rgba(58,139,255,.2);
  box-shadow:0 24px 80px rgba(58,139,255,.15);
}
.settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.8rem}
.settings-title{font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-1)}
.settings-close{
  background:rgba(255,255,255,.08);border:none;border-radius:50%;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);cursor:pointer;transition:background .15s;
}
[data-theme="light"] .settings-close{background:rgba(0,0,0,.07);color:var(--text-2)}
.settings-close:hover{background:rgba(255,255,255,.18);color:var(--text-1)}
[data-theme="light"] .settings-close:hover{background:rgba(0,0,0,.14)}

.settings-section{margin-bottom:1.6rem}
.settings-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.settings-section-label{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}

/* inline stepper in settings */
.inline-stepper{display:flex;align-items:center;gap:8px}
.inline-stepper button{
  width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);color:var(--text-1);font-size:15px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;font-family:inherit;
}
[data-theme="light"] .inline-stepper button{border-color:rgba(0,0,0,.15);background:rgba(0,0,0,.05);color:var(--text-1)}
.inline-stepper button:hover{background:rgba(255,255,255,.18)}
[data-theme="light"] .inline-stepper button:hover{background:rgba(0,0,0,.12)}
.inline-stepper span{font-size:14px;font-weight:700;min-width:20px;text-align:center;color:var(--text-1)}

/* theme toggle */
.theme-toggle{display:flex;gap:8px}
.theme-btn{
  flex:1;padding:10px 8px;border-radius:var(--r-md);
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:var(--text-2);font-size:13px;font-weight:600;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;
}
[data-theme="light"] .theme-btn{border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.04);color:var(--text-2)}
.theme-btn.active{border-color:var(--teal);background:rgba(20,241,196,.12);color:var(--teal)}
[data-theme="light"] .theme-btn.active{background:rgba(20,200,160,.12)}
.theme-btn:hover:not(.active){background:rgba(255,255,255,.1);color:var(--text-1)}
[data-theme="light"] .theme-btn:hover:not(.active){background:rgba(0,0,0,.08)}

/* name grid — 2 columns */
.name-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  max-height:260px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent;padding-right:2px;
}
.name-row{display:flex;align-items:center;gap:6px}
.name-idx{font-size:11px;color:var(--text-3);min-width:18px;text-align:right;font-weight:700}
.name-input{
  flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);
  padding:7px 10px;color:var(--text-1);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;
}
[data-theme="light"] .name-input{background:rgba(58,139,255,.06);border-color:rgba(58,139,255,.2);color:var(--text-1)}
.name-input:focus{border-color:var(--teal)}
.name-input::placeholder{color:var(--text-3)}

.settings-save{
  width:100%;padding:11px;border:none;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--teal),var(--blue));
  color:#022019;font-size:14px;font-weight:800;font-family:inherit;letter-spacing:.06em;
  cursor:pointer;transition:opacity .15s,transform .1s;margin-top:.5rem;
}
.settings-save:hover{opacity:.88}
.settings-save:active{transform:scale(.98)}

/* BOTTOM BAR */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--bar-h);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.08);
  box-shadow:0 -8px 40px rgba(0,0,0,.45);
  padding:.6rem 1.4rem;display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;
}
[data-theme="dark"] .bottom-bar,.bottom-bar{background:rgba(2,10,20,.92)}
[data-theme="light"] .bottom-bar{background:rgba(200,220,248,.92);border-top-color:rgba(58,139,255,.18)}

/* tall fade — uses a pseudo that covers the bottom-bar area above it */
.bottom-bar::before{
  content:'';
  position:absolute;left:0;right:0;
  bottom:100%;           /* sits just above the bar */
  height:80px;
  pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(var(--fade-color),1));
  z-index:51;
}

.bar-row{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.bar-label{flex-shrink:0;min-width:48px}
.bar-label-text{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff}
[data-theme="light"] .bar-label-text{color:#0d1f35}
.bar-circles{display:flex;gap:7px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:none}
.bar-circles::-webkit-scrollbar{display:none}
.circle{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
  background:rgba(255,255,255,.07);color:var(--text-2);border:1px solid rgba(255,255,255,.1);
  transition:transform .12s,background .15s,color .15s,border-color .15s;
}
[data-theme="light"] .circle{background:rgba(0,0,0,.06);border-color:rgba(58,139,255,.18);color:var(--text-2)}
.circle.athlete{cursor:pointer}
.circle.athlete:hover{background:rgba(20,241,196,.18);color:var(--teal);border-color:rgba(20,241,196,.45);transform:translateY(-3px)}

/* ATHLETE PANEL */
.athlete-panel{width:100%;display:flex;flex-direction:column;justify-content:center;z-index:2}
.ap-row{display:flex;align-items:center;gap:10px;width:100%;overflow:hidden}
.ap-back{
  flex-shrink:0;background:rgba(255,255,255,.08);border:none;border-radius:50%;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);cursor:pointer;transition:background .15s,color .15s;
}
[data-theme="light"] .ap-back{background:rgba(0,0,0,.07)}
.ap-back:hover{background:rgba(255,255,255,.18);color:var(--text-1)}
.ap-name{flex-shrink:0;font-size:15px;font-weight:700;color:var(--text-1);min-width:60px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-scores{flex:1;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.ap-scores::-webkit-scrollbar{display:none}
.ap-submit{flex-shrink:0}

/* SCORE INPUTS */
.score-input-row{display:flex;gap:10px;padding-bottom:2px}
.score-field{display:flex;flex-direction:column;gap:3px;flex:0 0 62px;border-right:1px solid rgba(255,255,255,.1);padding-right:8px}
[data-theme="light"] .score-field{border-right-color:rgba(0,0,0,.1)}
.score-field:last-child{border-right:none;padding-right:0}
.score-field-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-field-input{
  background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.18);border-radius:0;
  padding:3px 4px;color:var(--text-1);font-size:17px;font-weight:500;
  outline:none;font-family:inherit;text-align:center;transition:border-color .15s;width:100%;
  -moz-appearance:textfield;
}
[data-theme="light"] .score-field-input{border-bottom-color:rgba(0,0,0,.2);color:var(--text-1)}
.score-field-input::-webkit-inner-spin-button,
.score-field-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.score-field-input:focus{border-bottom-color:var(--teal);color:var(--teal)}
.score-field-input::placeholder{color:var(--text-3)}

.submit-btn{
  border:none;border-radius:var(--r-md);padding:9px 18px;
  color:#022019;font-size:13px;font-weight:800;letter-spacing:.06em;white-space:nowrap;
  cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--teal),var(--blue));
  box-shadow:0 4px 22px rgba(20,241,196,.3);transition:opacity .15s,transform .1s;
}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}

/* PODIUM */
.podium-overlay{
  position:fixed;inset:0;z-index:80;background:rgba(1,8,20,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;padding:2rem;
}
.podium-overlay.open{opacity:1;pointer-events:all}
.podium-card{
  background:linear-gradient(160deg,rgba(20,241,196,.12),rgba(58,139,255,.1),rgba(124,106,255,.08));
  border:1px solid rgba(255,255,255,.22);border-radius:var(--r-xl);
  padding:2.4rem 2rem 2rem;max-width:560px;width:100%;text-align:center;
  box-shadow:0 20px 80px rgba(20,241,196,.12),inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
}
.podium-title{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(200,230,255,.9);margin-bottom:2.2rem}
.podium-row{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:1.8rem}
.podium-col{display:flex;flex-direction:column;align-items:center;gap:.7rem;flex:1;min-width:0}
.podium-names{font-size:14px;font-weight:700;color:#fff;min-height:42px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;text-align:center;line-height:1.35;word-break:break-word;padding:0 4px}
.podium-name-tag{white-space:nowrap}
.podium-col.empty .podium-bar{opacity:.22;filter:grayscale(.6)}
.podium-col.empty .podium-names{color:var(--text-3)}
.podium-bar{width:100%;border-radius:var(--r-md) var(--r-md) 0 0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.podium-col.first  .podium-bar{height:128px;background:linear-gradient(180deg,rgba(255,209,102,.25),rgba(255,209,102,.06));color:var(--gold);box-shadow:0 0 24px rgba(255,209,102,.2),inset 0 1px 0 rgba(255,209,102,.4);border:1px solid rgba(255,209,102,.25)}
.podium-col.second .podium-bar{height:96px;background:linear-gradient(180deg,rgba(212,226,255,.18),rgba(212,226,255,.04));color:var(--silver);box-shadow:0 0 18px rgba(212,226,255,.15),inset 0 1px 0 rgba(212,226,255,.3);border:1px solid rgba(212,226,255,.18)}
.podium-col.third  .podium-bar{height:70px;background:linear-gradient(180deg,rgba(255,159,94,.22),rgba(255,159,94,.05));color:var(--bronze);box-shadow:0 0 18px rgba(255,159,94,.18),inset 0 1px 0 rgba(255,159,94,.35);border:1px solid rgba(255,159,94,.22)}
.podium-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:50px;padding:11px 32px;color:#fff;font-size:13px;letter-spacing:.1em;cursor:pointer;font-family:inherit;transition:background .15s}
.podium-close:hover{background:rgba(255,255,255,.2)}

/* RESPONSIVE */
@media(max-width:640px){
  :root{--bar-h:72px}
  .page{padding:1.5rem 1rem;padding-bottom:calc(var(--bar-h) + 3rem)}
  .rank-col-head,.rank-row{grid-template-columns:42px 1fr 88px}
  .rch-scores,.cell-scores{display:none}
  .cell-name{font-size:15px}
  .settle-btn{padding:8px 14px;font-size:11px}
  .bottom-bar{padding:.5rem 1rem}
  .bar-row{gap:8px}
  .bar-label{min-width:40px}
  .score-field{flex:0 0 58px}
  .settings-card{padding:1.4rem}
  .name-grid{grid-template-columns:1fr}
}
@media(max-width:400px){
  .header-actions{gap:6px}
  .icon-btn{width:34px;height:34px}
  .settle-btn{padding:7px 12px;font-size:10px}
}
</style>
</head>
<body>
<div class="bg-canvas"></div>

<div class="page">
  <header class="site-header">
    <div class="title-block">
      <div class="title-wrap">
        <h1 id="siteTitle" contenteditable="true" spellcheck="false" data-placeholder="Overall Rankings">Overall Rankings</h1>
        <span class="title-hint" onclick="focusTitle()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </span>
      </div>
      <div class="header-accent"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()" aria-label="設定">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="settle-btn" onclick="openPodium()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
        結算
      </button>
    </div>
  </header>

  <div class="glass-card rank-card">
    <div class="rank-col-head">
      <div style="text-align:center">排名</div>
      <div>選手</div>
      <div class="rch-scores">評審分數</div>
      <div style="text-align:center">平均</div>
    </div>
    <div class="rank-list" id="rankList"></div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="settings-overlay" id="settingsOverlay" onclick="onSettingsOverlayClick(event)">
  <div class="settings-card" id="settingsCard">
    <div class="settings-header">
      <span class="settings-title">⚙️ 設定</span>
      <button class="settings-close" onclick="closeSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="settings-section">
      <div class="settings-section-label" style="margin-bottom:.8rem">外觀模式</div>
      <div class="theme-toggle">
        <button class="theme-btn active" id="btnDark" onclick="setTheme('dark')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>深色
        </button>
        <button class="theme-btn" id="btnLight" onclick="setTheme('light')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>淺色
        </button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-header">
        <span class="settings-section-label">選手名單</span>
        <div class="inline-stepper">
          <button onclick="settingsAdjustAthletes(-1)">−</button>
          <span id="settingsAthleteCount">10</span>
          <button onclick="settingsAdjustAthletes(1)">＋</button>
        </div>
      </div>
      <div class="name-grid" id="settingsNameList"></div>
    </div>

    <div class="settings-section">
      <div class="settings-section-header">
        <span class="settings-section-label">評審人員</span>
        <div class="inline-stepper">
          <button onclick="settingsAdjustJudges(-1)">−</button>
          <span id="settingsJudgeCount">10</span>
          <button onclick="settingsAdjustJudges(1)">＋</button>
        </div>
      </div>
    </div>

    <button class="settings-save" onclick="saveSettings()">儲存</button>
  </div>
</div>

<!-- PODIUM -->
<div class="podium-overlay" id="podiumOverlay" onclick="closePodium(event)">
  <div class="podium-card">
    <p class="podium-title">🏆 Final Results</p>
    <div class="podium-row" id="podiumRow"></div>
    <button class="podium-close" onclick="closePodium()">關閉</button>
  </div>
</div>

<!-- BOTTOM BAR — athletes only -->
<div class="bottom-bar" id="bottomBar">
  <div id="rosterView" style="display:flex;align-items:center;gap:12px;width:100%;position:relative;z-index:2">
    <div class="bar-label"><span class="bar-label-text">選手</span></div>
    <div class="bar-circles" id="athleteCircles"></div>
  </div>
  <div id="athletePanel" class="athlete-panel" style="display:none">
    <div class="ap-row">
      <button class="ap-back" onclick="closeAthletePanel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="ap-name" id="apNameLabel"></span>
      <div class="score-input-row ap-scores" id="apScoreGrid"></div>
      <button class="submit-btn ap-submit" onclick="submitAthletePanel()">提交</button>
    </div>
  </div>
</div>

<script>
// STATE
let judges = Array.from({length:10},(_,i)=>'評審 '+(i+1));
let athletes = Array.from({length:10},(_,i)=>({id:i+1,name:'EPM '+(i+1),scores:Array(10).fill(null)}));
let nextId = 11;
let activeAthleteId = null;
let currentTheme = 'dark';
let prevOrder = [];
// temp settings state (while modal is open)
let tmpAthleteCount = 10;
let tmpJudgeCount = 10;

// SCORING
function avg(s){
  const v=s.filter(x=>x!==null);
  if(!v.length) return null;
  if(v.length<=2) return v.reduce((a,b)=>a+b,0)/v.length;
  const sorted=[...v].sort((a,b)=>a-b);
  return sorted.slice(1,-1).reduce((a,b)=>a+b,0)/(sorted.length-2);
}
function trimmedIndices(s){
  const v=s.map((x,i)=>({x,i})).filter(o=>o.x!==null);
  if(v.length<=2) return new Set();
  let mn=v[0],mx=v[0];
  v.forEach(o=>{if(o.x<mn.x)mn=o;if(o.x>mx.x)mx=o;});
  return new Set(mn.i===mx.i?[mn.i]:[mn.i,mx.i]);
}
function getRanked(){
  const sorted=[...athletes].sort((a,b)=>{
    const aa=avg(a.scores),ba=avg(b.scores);
    if(aa===null&&ba===null) return a.id-b.id;
    if(aa===null) return 1;if(ba===null) return -1;
    return ba-aa;
  });
  const ranks=[];
  sorted.forEach((a,i)=>{
    const av=avg(a.scores);
    if(av!==null&&i>0){
      const pav=avg(sorted[i-1].scores);
      if(pav!==null&&Math.abs(av-pav)<0.005){ranks.push(ranks[i-1]);return;}
    }
    ranks.push(i+1);
  });
  return sorted.map((a,i)=>({athlete:a,rank:ranks[i],avg:avg(a.scores)}));
}

// TITLE
function focusTitle(){
  const t=document.getElementById('siteTitle');t.focus();
  const r=document.createRange();r.selectNodeContents(t);r.collapse(false);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
}
document.getElementById('siteTitle').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
document.getElementById('siteTitle').addEventListener('paste',e=>{
  e.preventDefault();
  document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text').replace(/\n/g,' '));
});

// BADGE — dash when no scores, medal/number when scored
function badgeCls(rank,hasScore){
  if(!hasScore) return 'rb-empty';
  return rank===1?'rb-gold':rank===2?'rb-silver':rank===3?'rb-bronze':'rb-other';
}
function badgeContent(rank,hasScore){
  if(!hasScore) return '—';
  if(rank===1) return '<span style="font-size:17px">🥇</span>';
  if(rank===2) return '<span style="font-size:17px">🥈</span>';
  if(rank===3) return '<span style="font-size:17px">🥉</span>';
  return rank;
}

// RENDER RANKING
function buildRow(a,rank,av,animCls,delay){
  const hasScore=av!==null;
  const bc=badgeCls(rank,hasScore);
  const bc2=badgeContent(rank,hasScore);
  const trimmed=trimmedIndices(a.scores);
  const scoreItems=a.scores.map((sc,j)=>`
    <div class="score-item${trimmed.has(j)?' trimmed':''}">
      <span class="score-val${sc===null?' empty':''}">${sc!==null?sc.toFixed(1):'—'}</span>
    </div>`).join('');
  const avgHtml=hasScore
    ?`<span class="avg-num">${av.toFixed(2)}</span><span class="avg-denom"> /10</span>`
    :`<span class="avg-num zero">—</span>`;
  return `<div class="rank-row${animCls}" style="animation-delay:${delay}ms">
    <div class="cell-rank"><div class="rank-badge ${bc}">${bc2}</div></div>
    <div class="cell-name">${a.name}</div>
    <div class="cell-scores"><div class="score-group">${scoreItems}</div></div>
    <div class="cell-avg">${avgHtml}</div>
  </div>`;
}

function renderRanking(animate){
  const ranked=getRanked();
  const list=document.getElementById('rankList');
  if(!ranked.length){list.innerHTML='<div class="rank-empty">尚未新增選手</div>';return;}
  const newOrder=ranked.map(r=>r.athlete.id);
  if(animate&&prevOrder.length===newOrder.length){
    const movedIds=new Set(newOrder.filter((id,i)=>prevOrder[i]!==id));
    list.innerHTML=ranked.map(({athlete:a,rank:r,avg:av},i)=>{
      const prevIdx=prevOrder.indexOf(a.id);
      const animCls=movedIds.has(a.id)?(i<prevIdx?' row-anim-up':i>prevIdx?' row-anim-down':' row-anim-swap'):'';
      return buildRow(a,r,av,animCls,i*25);
    }).join('');
  } else {
    list.innerHTML=ranked.map(({athlete:a,rank:r,avg:av})=>buildRow(a,r,av,'',0)).join('');
  }
  prevOrder=newOrder;
}

// RENDER BAR
function renderBar(){
  document.getElementById('athleteCircles').innerHTML=
    athletes.map((a,i)=>`<div class="circle athlete" onclick="openAthletePanel(${a.id})">${i+1}</div>`).join('');
}

// ATHLETE PANEL
function openAthletePanel(id){
  activeAthleteId=id;
  const a=athletes.find(x=>x.id===id);if(!a)return;
  document.getElementById('apNameLabel').textContent=a.name;
  document.getElementById('apScoreGrid').innerHTML=judges.map((j,i)=>`
    <div class="score-field">
      <span class="score-field-label">${j}</span>
      <input class="score-field-input" id="apf_${i}" type="number" inputmode="decimal"
        value="${a.scores[i]!==null?a.scores[i]:''}" placeholder="—" min="0" max="10" step="0.1"/>
    </div>`).join('');
  document.getElementById('rosterView').style.display='none';
  document.getElementById('athletePanel').style.display='flex';
  const first=document.querySelector('#apScoreGrid .score-field-input');
  if(first) setTimeout(()=>first.focus(),50);
}
function closeAthletePanel(){
  activeAthleteId=null;
  document.getElementById('athletePanel').style.display='none';
  document.getElementById('rosterView').style.display='flex';
}
function submitAthletePanel(){
  const a=athletes.find(x=>x.id===activeAthleteId);if(!a)return;
  judges.forEach((_,i)=>{
    const el=document.getElementById('apf_'+i);if(!el)return;
    const raw=el.value.trim();
    a.scores[i]=raw===''?null:isNaN(parseFloat(raw))?null:Math.min(10,Math.max(0,parseFloat(raw)));
  });
  renderRanking(true);
  closeAthletePanel();
}

// THEME
function setTheme(t){
  currentTheme=t;
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('btnDark').classList.toggle('active',t==='dark');
  document.getElementById('btnLight').classList.toggle('active',t==='light');
}

// SETTINGS
function openSettings(){
  tmpAthleteCount=athletes.length;
  tmpJudgeCount=judges.length;
  rebuildSettingsNameList();
  document.getElementById('settingsAthleteCount').textContent=tmpAthleteCount;
  document.getElementById('settingsJudgeCount').textContent=tmpJudgeCount;
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open')}
function onSettingsOverlayClick(e){if(e.target===document.getElementById('settingsOverlay'))closeSettings()}

function rebuildSettingsNameList(){
  const nl=document.getElementById('settingsNameList');
  nl.innerHTML=Array.from({length:tmpAthleteCount},(_,i)=>{
    const a=athletes[i];
    const val=a?a.name:'EPM '+(i+1);
    const aid=a?a.id:('new_'+i);
    return `<div class="name-row">
      <span class="name-idx">${i+1}</span>
      <input class="name-input" id="sn_${aid}" data-idx="${i}" value="${val}" placeholder="選手 ${i+1}" maxlength="20"/>
    </div>`;
  }).join('');
}

function settingsAdjustAthletes(d){
  tmpAthleteCount=Math.max(1,tmpAthleteCount+d);
  document.getElementById('settingsAthleteCount').textContent=tmpAthleteCount;
  rebuildSettingsNameList();
}
function settingsAdjustJudges(d){
  tmpJudgeCount=Math.max(1,tmpJudgeCount+d);
  document.getElementById('settingsJudgeCount').textContent=tmpJudgeCount;
}

function saveSettings(){
  // Apply athlete count changes
  while(athletes.length<tmpAthleteCount)
    athletes.push({id:nextId++,name:'EPM '+(athletes.length+1),scores:Array(judges.length).fill(null)});
  while(athletes.length>tmpAthleteCount){
    const removed=athletes.pop();
    if(activeAthleteId===removed.id) closeAthletePanel();
  }
  // Apply names
  athletes.forEach((a,i)=>{
    const el=document.querySelector(`[data-idx="${i}"]`);
    if(el){const v=el.value.trim();if(v)a.name=v;}
  });
  // Apply judge count changes
  while(judges.length<tmpJudgeCount){
    judges.push('評審 '+(judges.length+1));
    athletes.forEach(a=>a.scores.push(null));
  }
  while(judges.length>tmpJudgeCount){
    judges.pop();
    athletes.forEach(a=>a.scores.pop());
  }
  renderRanking(false);
  renderBar();
  closeSettings();
}

// PODIUM
function openPodium(){
  launchConfetti();
  const ranked=getRanked();
  const groups={1:[],2:[],3:[]};
  ranked.forEach(({athlete:a,rank:r})=>{if(r<=3)groups[r].push(a.name)});
  const icon={1:'🥇',2:'🥈',3:'🥉'};
  const cls={1:'first',2:'second',3:'third'};
  document.getElementById('podiumRow').innerHTML=[2,1,3].map(r=>`
    <div class="podium-col ${cls[r]}${groups[r].length===0?' empty':''}">
      <div class="podium-names">
        ${groups[r].length>0?groups[r].map(n=>`<span class="podium-name-tag">${n}</span>`).join(''):'—'}
      </div>
      <div class="podium-bar">${icon[r]}</div>
    </div>`).join('');
  document.getElementById('podiumOverlay').classList.add('open');
}
function closePodium(e){
  if(e&&e.target!==e.currentTarget)return;
  document.getElementById('podiumOverlay').classList.remove('open');
}

// CONFETTI
function launchConfetti(){
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;z-index:999;pointer-events:none;width:100%;height:100%';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=['#ffd166','#14f1c4','#3a8bff','#ff9f5e','#d4e2ff','#a78bfa','#f472b6'];
  const P=Array.from({length:160},()=>({
    x:Math.random()*canvas.width,y:-20-Math.random()*120,
    w:6+Math.random()*8,h:10+Math.random()*14,
    color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.18,
    vx:(Math.random()-.5)*4,vy:3+Math.random()*4,alpha:1
  }));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    P.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;
      if(f>90)p.alpha=Math.max(0,p.alpha-.012);
      ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });f++;
    if(f<160)requestAnimationFrame(draw);else canvas.remove();
  })();
}

// INIT
setTheme('dark');
renderRanking(false);
renderBar();
</script>
</body>
</html>
