<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Overall Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0cbe90;--blue:#3a9fff;
  --gold:#e8c76a;--silver:#9ab1cc;--bronze:#c0845a;
  --text-1:#eef4ff;--text-2:#8aaccc;--text-3:#3a536e;
  --danger:#ff6060;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans TC',sans-serif;color:var(--text-1);min-height:100vh;overflow-x:hidden;background:#020a14}

/* ── BG ── */
.bg-canvas{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,rgba(60,120,255,.22) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 5%,rgba(12,190,144,.18) 0%,transparent 55%),
    radial-gradient(ellipse 70% 40% at 50% 100%,rgba(124,106,255,.14) 0%,transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%,#020d1c 40%,#010812 100%);
}
.bg-canvas::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 320px at 20% 35%,rgba(12,190,144,.08) 0%,transparent 70%),
             radial-gradient(circle 280px at 80% 65%,rgba(60,120,255,.09) 0%,transparent 70%);
  animation:blobdrift 18s ease-in-out infinite alternate}
@keyframes blobdrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,18px) scale(1.05)}}

/* ── LAYOUT ── */
.page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:2.5rem 2rem 8rem}

/* ── EDIT BTN ── */
.edit-corner-btn{
  position:fixed;top:1.4rem;right:1.8rem;z-index:50;
  display:flex;align-items:center;gap:7px;
  padding:8px 16px;border:none;cursor:pointer;
  border-radius:50px;font-family:inherit;font-size:12px;font-weight:600;
  letter-spacing:.06em;color:#fff;
  background:linear-gradient(135deg,#0a9e78,#1870c8);
  box-shadow:0 4px 18px rgba(12,190,144,.28),0 2px 6px rgba(0,0,0,.3);
  transition:transform .15s,box-shadow .15s;
}
.edit-corner-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(12,190,144,.38)}
.edit-corner-btn:active{transform:scale(.97)}
.edit-corner-btn.panel-open{display:none}

/* ── HEADER ── */
.site-header{text-align:center;margin-bottom:3rem;padding-top:.5rem}
.title-wrap{display:inline-flex;align-items:center;gap:10px;cursor:pointer;position:relative}
.title-wrap:hover .title-hint{opacity:1}
.title-hint{position:absolute;right:-24px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .2s}
.title-hint svg{color:var(--text-3)}
#siteTitle{
  font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(130deg,#eef4ff 20%,var(--teal) 75%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.1;border:none;background-color:transparent;
  font-family:inherit;cursor:pointer;text-align:center;width:auto;min-width:2ch;
}
#siteTitle:focus{outline:none;-webkit-text-fill-color:var(--text-1);background:none;color:var(--text-1)}
.header-accent{width:60px;height:2px;margin:.9rem auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--teal) 40%,var(--blue),transparent)}

/* ── COLUMN HEADS ── */
.rank-col-head{
  display:grid;grid-template-columns:60px 1fr 2.5fr 110px;
  padding:0 1rem .6rem;
  font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3);
}
.rch-rank{text-align:center}
.rch-avg{text-align:right}

/* ── ROWS ── */
.rank-list{position:relative}

.rank-row{
  display:grid;grid-template-columns:60px 1fr 2.5fr 110px;
  align-items:center;
  padding:0;
  border-bottom:1px solid rgba(255,255,255,.055);
  cursor:pointer;
  transition:background .15s;
  position:relative;
}
.rank-row:first-child{border-top:1px solid rgba(255,255,255,.055)}
.rank-row:hover{background:rgba(255,255,255,.04)}
.rank-row.active-row{background:rgba(12,190,144,.07)}

/* badge */
.cell-rank{display:flex;align-items:center;justify-content:center;padding:.9rem .5rem}
.rank-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.rb-gold  {background:linear-gradient(135deg,rgba(232,199,106,.3),rgba(232,199,106,.1));color:var(--gold)}
.rb-silver{background:linear-gradient(135deg,rgba(154,177,204,.3),rgba(154,177,204,.1));color:var(--silver)}
.rb-bronze{background:linear-gradient(135deg,rgba(192,132,90,.3),rgba(192,132,90,.1));color:var(--bronze)}
.rb-other {background:rgba(255,255,255,.05);color:var(--text-2)}

/* name */
.cell-name{padding:.9rem .5rem;font-size:16px;font-weight:600;color:var(--text-1)}

/* scores */
.cell-scores{padding:.9rem .5rem}
.score-group{display:flex;flex-wrap:wrap;gap:8px 18px}
.score-item{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.score-judge-lbl{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.score-val{font-size:15px;font-weight:500;color:rgba(255,255,255,.8)}
.score-val.empty{color:var(--text-3)}

/* avg */
.cell-avg{padding:.9rem 1rem .9rem .5rem;text-align:right}
.avg-num{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.avg-num.zero{font-size:18px;-webkit-text-fill-color:var(--text-3);background:none;color:var(--text-3)}
.avg-denom{font-size:11px;color:var(--text-3);-webkit-text-fill-color:var(--text-3)}

/* empty */
.rank-empty{text-align:center;padding:4rem 2rem;color:var(--text-3);font-size:15px;letter-spacing:.06em}

/* ── BOTTOM SHEET ── */
.sheet-overlay{
  position:fixed;inset:0;z-index:40;
  background:rgba(1,8,20,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.sheet-overlay.open{opacity:1;pointer-events:all}

.bottom-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:rgba(3,16,34,.92);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  box-shadow:0 -4px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.25,.8,.25,1);
  max-height:85vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent;
}
.bottom-sheet.open{transform:translateY(0)}

.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:14px auto 0}

.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.4rem 1.8rem 1rem;
}
.sheet-athlete-info{display:flex;align-items:center;gap:14px}
.sheet-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.sheet-name{font-size:20px;font-weight:700;color:var(--text-1)}
.sheet-rank-label{font-size:12px;color:var(--text-2);margin-top:2px}
.sheet-close{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.sheet-close:hover{background:rgba(255,255,255,.15);color:var(--text-1)}

.sheet-body{padding:0 1.8rem 2rem;display:flex;flex-direction:column;gap:1.6rem}

/* score input grid */
.score-input-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.score-field{display:flex;flex-direction:column;gap:6px}
.score-field-label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
.score-field-input{
  background:rgba(255,255,255,.07);border:none;border-radius:var(--r-md);
  padding:13px 16px;color:var(--text-1);font-size:17px;font-weight:500;
  outline:none;font-family:inherit;text-align:center;
  transition:background .15s;width:100%;
}
.score-field-input:focus{background:rgba(255,255,255,.12);color:var(--teal)}
.score-field-input::placeholder{color:var(--text-3)}

.submit-btn{
  width:100%;border:none;border-radius:var(--r-lg);padding:15px;
  color:#fff;font-size:16px;font-weight:700;letter-spacing:.06em;
  cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#0a9e78,#1870c8);
  box-shadow:0 4px 20px rgba(12,190,144,.3);
  transition:opacity .15s,transform .1s;
}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}

/* ── MANAGE PANEL (right slide) ── */
.panel-overlay{position:fixed;inset:0;z-index:55;background:rgba(1,8,20,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s}
.panel-overlay.open{opacity:1;pointer-events:all}
.slide-panel{
  position:fixed;right:0;top:0;bottom:0;z-index:60;
  width:min(460px,100vw);
  background:rgba(3,14,30,.92);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  box-shadow:-6px 0 60px rgba(0,0,0,.6),inset 1px 0 0 rgba(255,255,255,.06);
  transform:translateX(100%);transition:transform .32s cubic-bezier(.25,.8,.25,1);
  overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent;
}
.slide-panel.open{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:2rem 2rem 1.6rem;position:sticky;top:0;background:rgba(3,14,30,.95);backdrop-filter:blur(20px);z-index:2}
.panel-head h2{font-size:19px;font-weight:700;letter-spacing:.08em;color:var(--text-1)}
.panel-close{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;transition:background .15s,color .15s}
.panel-close:hover{background:rgba(255,255,255,.15);color:var(--text-1)}
.panel-body{padding:1.4rem 2rem 2.5rem;flex:1;display:flex;flex-direction:column;gap:2.4rem}
.panel-sec-head{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:1rem}
.edit-list{display:flex;flex-direction:column;gap:8px}
.edit-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:var(--r-md);padding:12px 14px}
.edit-item-icon{color:var(--text-3);flex-shrink:0;display:flex}
.edit-item-input{flex:1;background:none;border:none;outline:none;color:var(--text-1);font-size:15px;font-family:inherit;min-width:0}
.edit-item-input::placeholder{color:var(--text-3)}
.edit-item-input:focus{color:var(--teal)}
.item-del-btn{background:none;border:none;cursor:pointer;color:var(--text-3);transition:color .15s;padding:2px 4px;font-size:15px;line-height:1}
.item-del-btn:hover{color:var(--danger)}
.add-row-btn{margin-top:10px;width:100%;background:rgba(12,190,144,.08);border:none;border-radius:var(--r-md);padding:12px;color:var(--teal);font-size:14px;letter-spacing:.08em;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s}
.add-row-btn:hover{background:rgba(12,190,144,.15)}
.divider{height:1px;background:rgba(255,255,255,.05)}
.form-label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;display:block}
.form-input{width:100%;background:rgba(255,255,255,.06);border:none;border-radius:var(--r-md);padding:12px 14px;color:var(--text-1);font-size:14px;outline:none;font-family:inherit;transition:background .15s}
.form-input:focus{background:rgba(255,255,255,.1)}
.form-input::placeholder{color:var(--text-3)}
.score-grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.save-btn{margin-top:4px;width:100%;border:none;border-radius:var(--r-md);padding:13px;color:#fff;font-size:14px;font-weight:600;letter-spacing:.06em;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#0a9e78,#1870c8);transition:opacity .15s}
.save-btn:hover{opacity:.88}

/* responsive */
@media(max-width:640px){
  .page{padding:2rem 1rem 8rem}
  .rank-col-head,.rank-row{grid-template-columns:50px 1fr 100px}
  .rch-scores,.cell-scores{display:none}
  .edit-corner-btn{top:1rem;right:1rem}
  .score-input-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media(max-width:400px){.slide-panel{width:100vw}}
</style>
</head>
<body>
<div class="bg-canvas"></div>

<!-- EDIT BTN -->
<button class="edit-corner-btn" id="editBtn" onclick="openPanel()">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  管理
</button>

<div class="page">
  <!-- HEADER -->
  <header class="site-header">
    <div class="title-wrap" onclick="focusTitle()">
      <input id="siteTitle" value="Overall Rankings" spellcheck="false" oninput="autoWidth(this)" onblur="autoWidth(this)"/>
      <span class="title-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </span>
    </div>
    <div class="header-accent"></div>
  </header>

  <!-- RANKING -->
  <div>
    <div class="rank-col-head">
      <div class="rch-rank">排名</div>
      <div>選手</div>
      <div class="rch-scores">評審分數</div>
      <div class="rch-avg">平均分數</div>
    </div>
    <div class="rank-list" id="rankList"></div>
  </div>
</div>

<!-- BOTTOM SHEET OVERLAY -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<!-- BOTTOM SHEET -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-athlete-info">
      <div class="sheet-badge" id="sheetBadge"></div>
      <div>
        <div class="sheet-name" id="sheetName"></div>
        <div class="sheet-rank-label" id="sheetRankLabel"></div>
      </div>
    </div>
    <button class="sheet-close" onclick="closeSheet()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="score-input-grid" id="sheetScoreGrid"></div>
    <button class="submit-btn" onclick="submitScores()">提交分數</button>
  </div>
</div>

<!-- MANAGE PANEL OVERLAY -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

<!-- MANAGE PANEL -->
<div class="slide-panel" id="slidePanel">
  <div class="panel-head">
    <h2>管理</h2>
    <button class="panel-close" onclick="closePanel()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div>
      <p class="panel-sec-head">評審列表</p>
      <div class="edit-list" id="judgeEditList"></div>
      <button class="add-row-btn" onclick="addJudge()">＋ 新增評審</button>
    </div>
    <div class="divider"></div>
    <div>
      <p class="panel-sec-head">選手列表</p>
      <div class="edit-list" id="athleteEditList"></div>
      <button class="add-row-btn" onclick="showAddForm()">＋ 新增選手</button>
    </div>
    <div id="addAthleteForm" style="display:none">
      <div class="divider" style="margin-bottom:1.2rem"></div>
      <p class="panel-sec-head">新增選手</p>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label class="form-label">姓名</label>
          <input class="form-input" id="newName" placeholder="選手姓名"/>
        </div>
        <button class="save-btn" onclick="addAthlete()">確認新增</button>
      </div>
    </div>
  </div>
</div>

<script>
let judges = ['評審 1','評審 2','評審 3','評審 4','評審 5'];
let athletes = [
  {id:1,name:'EPM 1',scores:[null,null,null,null,null]},
  {id:2,name:'EPM 2',scores:[null,null,null,null,null]},
  {id:3,name:'EPM 3',scores:[null,null,null,null,null]},
  {id:4,name:'EPM 4',scores:[null,null,null,null,null]},
  {id:5,name:'EPM 5',scores:[null,null,null,null,null]},
];
let nextId = 6;
let activeSheetId = null;

function avg(s){
  const valid=s.filter(x=>x!==null&&x!==undefined);
  return valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
}

/* title */
function autoWidth(el){
  const sp=document.createElement('span');
  sp.style.cssText='position:absolute;visibility:hidden;white-space:pre;font-size:'+getComputedStyle(el).fontSize+';font-weight:'+getComputedStyle(el).fontWeight+';letter-spacing:'+getComputedStyle(el).letterSpacing+';font-family:'+getComputedStyle(el).fontFamily;
  sp.textContent=el.value||el.placeholder||'X';
  document.body.appendChild(sp);el.style.width=(sp.offsetWidth+24)+'px';document.body.removeChild(sp);
}
function focusTitle(){const t=document.getElementById('siteTitle');t.focus();t.select();}
window.addEventListener('load',()=>autoWidth(document.getElementById('siteTitle')));

/* render ranking */
function rankLabel(r){return r===1?'1st Place':r===2?'2nd Place':r===3?'3rd Place':`${r}th Place`}
function badgeCls(r){return r===1?'rb-gold':r===2?'rb-silver':r===3?'rb-bronze':'rb-other'}

function renderRanking(){
  const sorted=[...athletes].sort((a,b)=>{
    const aa=avg(a.scores),ba=avg(b.scores);
    if(aa===null&&ba===null) return a.id-b.id;
    if(aa===null) return 1;
    if(ba===null) return -1;
    return ba-aa;
  });
  const list=document.getElementById('rankList');
  if(!sorted.length){list.innerHTML='<div class="rank-empty">尚未新增選手</div>';return;}
  list.innerHTML=sorted.map((a,i)=>{
    const r=i+1;
    const bc=badgeCls(r);
    const av=avg(a.scores);
    const isActive=activeSheetId===a.id;
    const scoreItems=a.scores.map((sc,j)=>`
      <div class="score-item">
        <span class="score-judge-lbl">${judges[j]||'J'+(j+1)}</span>
        <span class="score-val${sc===null||sc===undefined?' empty':''}">${sc!==null&&sc!==undefined?sc.toFixed(1):'—'}</span>
      </div>`).join('');
    const avgHtml=av!==null
      ?`<span class="avg-num">${av.toFixed(2)}</span><span class="avg-denom"> / 10</span>`
      :`<span class="avg-num zero">—</span>`;
    return `
    <div class="rank-row${isActive?' active-row':''}" id="row_${a.id}" onclick="openSheet(${a.id})">
      <div class="cell-rank"><div class="rank-badge ${bc}">${r}</div></div>
      <div class="cell-name">${a.name}</div>
      <div class="cell-scores"><div class="score-group">${scoreItems}</div></div>
      <div class="cell-avg">${avgHtml}</div>
    </div>`;
  }).join('');
}

/* bottom sheet */
function openSheet(id){
  if(activeSheetId===id){closeSheet();return;}
  activeSheetId=id;
  const a=athletes.find(x=>x.id===id);
  const sorted=[...athletes].sort((a,b)=>{const aa=avg(a.scores),ba=avg(b.scores);if(aa===null&&ba===null)return a.id-b.id;if(aa===null)return 1;if(ba===null)return -1;return ba-aa;});
  const r=sorted.findIndex(x=>x.id===id)+1;
  const bc=badgeCls(r);

  // badge styling
  const badgeEl=document.getElementById('sheetBadge');
  badgeEl.className='sheet-badge '+bc;
  badgeEl.textContent=r;
  document.getElementById('sheetName').textContent=a.name;
  document.getElementById('sheetRankLabel').textContent=rankLabel(r);

  // score inputs
  document.getElementById('sheetScoreGrid').innerHTML=judges.map((j,i)=>`
    <div class="score-field">
      <span class="score-field-label">${j}</span>
      <input class="score-field-input" id="sf_${i}" type="number"
        value="${a.scores[i]!==null&&a.scores[i]!==undefined?a.scores[i]:''}"
        placeholder="0.0" min="0" max="10" step="0.1"/>
    </div>`).join('');

  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
  renderRanking();
}
function closeSheet(){
  activeSheetId=null;
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
  renderRanking();
}
function submitScores(){
  const a=athletes.find(x=>x.id===activeSheetId);
  if(!a) return;
  judges.forEach((_,i)=>{
    const el=document.getElementById('sf_'+i);
    if(!el) return;
    const raw=el.value.trim();
    if(raw===''){a.scores[i]=null;}
    else{const v=parseFloat(raw);a.scores[i]=isNaN(v)?null:Math.min(10,Math.max(0,v));}
  });
  closeSheet();
}

/* manage panel */
let panelOpen=false;
function openPanel(){
  panelOpen=true;
  document.getElementById('slidePanel').classList.add('open');
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('editBtn').classList.add('panel-open');
  renderPanel();
}
function closePanel(){
  panelOpen=false;
  document.getElementById('slidePanel').classList.remove('open');
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('editBtn').classList.remove('panel-open');
}

function renderPanel(){
  document.getElementById('judgeEditList').innerHTML=judges.map((j,i)=>`
    <div class="edit-item">
      <span class="edit-item-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      <input class="edit-item-input" value="${j}" placeholder="評審名稱" onchange="renameJudge(${i},this.value)"/>
      <button class="item-del-btn" onclick="removeJudge(${i})">✕</button>
    </div>`).join('');
  document.getElementById('athleteEditList').innerHTML=athletes.map(a=>`
    <div class="edit-item">
      <span class="edit-item-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
      <input class="edit-item-input" value="${a.name}" placeholder="選手姓名" onchange="renameAthlete(${a.id},this.value)"/>
      <button class="item-del-btn" onclick="deleteAthlete(${a.id})">✕</button>
    </div>`).join('');
}

function renameJudge(i,v){if(v.trim())judges[i]=v.trim();renderRanking();}
function renameAthlete(id,v){const a=athletes.find(x=>x.id===id);if(a&&v.trim())a.name=v.trim();renderRanking();}
function addJudge(){
  judges.push('評審 '+(judges.length+1));
  athletes.forEach(a=>a.scores.push(null));
  renderRanking();renderPanel();
}
function removeJudge(i){
  if(judges.length<=1){alert('至少需要一位評審');return;}
  if(!confirm(`確定移除「${judges[i]}」？`)) return;
  judges.splice(i,1);athletes.forEach(a=>a.scores.splice(i,1));
  renderRanking();renderPanel();
}
function deleteAthlete(id){
  if(!confirm('確定刪除此選手？')) return;
  athletes=athletes.filter(a=>a.id!==id);
  if(activeSheetId===id) closeSheet();
  renderRanking();renderPanel();
}
function showAddForm(){
  const f=document.getElementById('addAthleteForm');
  f.style.display=f.style.display==='none'?'block':'none';
}
function addAthlete(){
  const n=document.getElementById('newName').value.trim();
  if(!n){alert('請輸入選手姓名');return;}
  athletes.push({id:nextId++,name:n,scores:judges.map(()=>null)});
  document.getElementById('newName').value='';
  document.getElementById('addAthleteForm').style.display='none';
  renderRanking();renderPanel();
}

renderRanking();
</script>
</body>
</html>
