<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Overall Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#14f1c4;--blue:#3a8bff;
  --gold:#ffd166;--silver:#d4e2ff;--bronze:#ff9f5e;
  --text-1:#f4f9ff;--text-2:#9fc1e8;--text-3:#3f5c7a;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --bar-h:148px;
}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans TC',sans-serif;color:var(--text-1);min-height:100vh;overflow-x:hidden;background:#020a14}

/* ── BG ── */
.bg-canvas{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,rgba(58,139,255,.32) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 5%,rgba(20,241,196,.26) 0%,transparent 55%),
    radial-gradient(ellipse 70% 40% at 50% 100%,rgba(124,106,255,.2) 0%,transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%,#020d1c 40%,#010812 100%);
}
.bg-canvas::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle 360px at 20% 35%,rgba(20,241,196,.14) 0%,transparent 70%),
             radial-gradient(circle 320px at 80% 65%,rgba(58,139,255,.16) 0%,transparent 70%);
  animation:blobdrift 18s ease-in-out infinite alternate}
@keyframes blobdrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,18px) scale(1.05)}}

/* ── LAYOUT ── */
.page{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:2.5rem 2rem;padding-bottom:calc(var(--bar-h) + 2rem)}

/* ── HEADER ── */
.site-header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;margin-bottom:2rem;padding-top:.5rem}
.title-block{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.title-wrap{display:inline-flex;align-items:center;gap:10px;position:relative;max-width:100%}
.title-wrap:hover .title-hint{opacity:1}
.title-hint{flex-shrink:0;opacity:0;transition:opacity .2s;display:flex;cursor:pointer}
.title-hint svg{color:var(--text-3)}
#siteTitle{
  font-size:clamp(1.4rem,4vw,2.2rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(130deg,#eef4ff 20%,var(--teal) 75%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;outline:none;cursor:text;white-space:nowrap;
}
#siteTitle:focus{-webkit-text-fill-color:var(--text-1);background:none;color:var(--text-1)}
#siteTitle:empty:before{content:attr(data-placeholder);-webkit-text-fill-color:var(--text-3);background:none;color:var(--text-3)}
.header-accent{width:60px;height:3px;margin:.7rem 0 0;border-radius:2px;
  background:linear-gradient(90deg,var(--teal),var(--blue))}

.settle-btn{
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  padding:10px 22px;border:none;cursor:pointer;
  border-radius:50px;font-family:inherit;font-size:13px;font-weight:700;
  letter-spacing:.1em;color:#022019;
  background:linear-gradient(135deg,var(--gold),var(--bronze));
  box-shadow:0 4px 18px rgba(255,209,102,.3),0 2px 6px rgba(0,0,0,.3);
  transition:transform .15s,box-shadow .15s;
}
.settle-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,209,102,.4)}
.settle-btn:active{transform:scale(.97)}

/* ── GLASS CARD (shared) ── */
.glass-card{
  background:linear-gradient(165deg,rgba(58,139,255,.1),rgba(20,241,196,.05));
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-xl);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 12px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
.rank-card{padding:1.1rem 0 .4rem;overflow:hidden}
.section-card{padding:1.4rem;margin-top:1.6rem}

/* ── COLUMN HEADS ── */
.rank-col-head{
  display:grid;grid-template-columns:52px 1fr 4.2fr 100px;
  padding:0 1.4rem .3rem;
  font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-2);
  text-align:center;
}

/* ── ROWS ── */
.rank-list{position:relative}

.rank-row{
  display:grid;grid-template-columns:52px 1fr 4.2fr 100px;
  align-items:center;
  padding:0 1.4rem;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.rank-row:last-child{border-bottom:none}

/* badge */
.cell-rank{display:flex;align-items:center;justify-content:center;padding:.55rem .2rem}
.rank-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.rb-gold  {background:linear-gradient(135deg,rgba(255,209,102,.4),rgba(255,209,102,.12));color:var(--gold);box-shadow:0 0 16px rgba(255,209,102,.35)}
.rb-silver{background:linear-gradient(135deg,rgba(212,226,255,.35),rgba(212,226,255,.1));color:var(--silver);box-shadow:0 0 14px rgba(212,226,255,.2)}
.rb-bronze{background:linear-gradient(135deg,rgba(255,159,94,.4),rgba(255,159,94,.12));color:var(--bronze);box-shadow:0 0 14px rgba(255,159,94,.3)}
.rb-other {background:rgba(255,255,255,.06);color:var(--text-2)}

/* name */
.cell-name{padding:.55rem .4rem;font-size:18px;font-weight:700;color:var(--text-1);text-align:center}

/* scores */
.cell-scores{padding:.55rem .5rem;overflow:hidden}
.score-group{display:flex;flex-wrap:nowrap;justify-content:flex-start;align-items:center;overflow-x:auto;scrollbar-width:none}
.score-group::-webkit-scrollbar{display:none}
.score-item{display:flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:44px;padding:0 14px;border-right:1px solid rgba(255,255,255,.08)}
.score-item:last-child{border-right:none}
.score-item.trimmed .score-val{color:var(--text-3);text-decoration:line-through;text-decoration-color:rgba(255,159,94,.6)}
.score-val{font-size:16px;font-weight:600;color:var(--text-1)}
.score-val.empty{color:var(--text-3)}

/* avg */
.cell-avg{padding:.55rem 1rem;text-align:center}
.avg-num{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.avg-num.zero{font-size:18px;-webkit-text-fill-color:var(--text-3);background:none;color:var(--text-3)}
.avg-denom{font-size:12px;color:var(--text-3);-webkit-text-fill-color:var(--text-3)}

/* empty */
.rank-empty{text-align:center;padding:4rem 2rem;color:var(--text-3);font-size:15px;letter-spacing:.06em}

/* ── BOTTOM ROSTER BAR ── */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--bar-h);
  background:rgba(3,14,30,.92);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.08);
  box-shadow:0 -8px 40px rgba(0,0,0,.4);
  padding:.8rem 1.4rem;display:flex;flex-direction:column;justify-content:center;gap:.7rem;
}
.bar-row{display:flex;align-items:center;gap:14px}
.bar-label{display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:128px}
.bar-label-text{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.bar-circles{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:none}
.bar-circles::-webkit-scrollbar{display:none}
.circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,.06);color:var(--text-2);border:1px solid rgba(255,255,255,.08);transition:transform .12s,background .15s,color .15s,border-color .15s}
.circle.athlete{cursor:pointer}
.circle.athlete:hover{background:rgba(20,241,196,.16);color:var(--teal);border-color:rgba(20,241,196,.4);transform:translateY(-3px)}

/* ── ATHLETE EDIT MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:65;background:rgba(1,8,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-card{
  position:fixed;left:50%;bottom:calc(var(--bar-h) + 16px);transform:translate(-50%,16px);
  width:min(560px,94vw);
  background:rgba(3,14,30,.96);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-xl);
  box-shadow:0 -10px 60px rgba(0,0,0,.55);z-index:66;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;padding:1.4rem;
}
.modal-card.open{opacity:1;pointer-events:all;transform:translate(-50%,0)}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:1.1rem}
.modal-name-input{flex:1;background:rgba(255,255,255,.06);border:none;border-radius:var(--r-md);padding:11px 14px;color:var(--text-1);font-size:16px;font-weight:600;font-family:inherit;outline:none}
.modal-name-input::placeholder{color:var(--text-3)}
.modal-name-input:focus{color:var(--teal);background:rgba(255,255,255,.1)}
.modal-close{background:rgba(255,255,255,.08);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;flex-shrink:0;transition:background .15s,color .15s}
.modal-close:hover{background:rgba(255,255,255,.15);color:var(--text-1)}
.modal-body{margin-bottom:1.1rem}
.modal-foot{display:flex;justify-content:flex-end}

/* ── SCORE INPUTS (shared) ── */
.score-input-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;scrollbar-color:var(--text-3) transparent}
.score-field{display:flex;flex-direction:column;gap:6px;flex:0 0 86px}
.score-field-label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-field-input{
  background:rgba(255,255,255,.07);border:none;border-radius:var(--r-md);
  padding:13px 10px;color:var(--text-1);font-size:17px;font-weight:500;
  outline:none;font-family:inherit;text-align:center;
  transition:background .15s;width:100%;
}
.score-field-input:focus{background:rgba(255,255,255,.12);color:var(--teal)}
.score-field-input::placeholder{color:var(--text-3)}

.submit-btn{
  border:none;border-radius:var(--r-lg);padding:13px 28px;
  color:#022019;font-size:14px;font-weight:800;letter-spacing:.06em;white-space:nowrap;
  cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--teal),var(--blue));
  box-shadow:0 4px 22px rgba(20,241,196,.35);
  transition:opacity .15s,transform .1s;
}
.submit-btn:hover{opacity:.88}
.submit-btn:active{transform:scale(.98)}

/* ── EXPORT ── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.section-title{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-2)}
.export-row{display:flex;gap:10px}
.add-row-btn{width:100%;background:rgba(20,241,196,.1);border:none;border-radius:var(--r-md);padding:12px;color:var(--teal);font-size:14px;letter-spacing:.08em;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s;flex:1}
.add-row-btn:hover{background:rgba(20,241,196,.18)}

/* ── STEPPER ── */
.stepper{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:50px;padding:5px 8px}
.stepper button{width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--text-1);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit}
.stepper button:hover{background:rgba(255,255,255,.18)}
.stepper span{font-size:13px;font-weight:700;min-width:16px;text-align:center;color:var(--text-1)}

/* ── PODIUM ── */
.podium-overlay{position:fixed;inset:0;z-index:80;background:rgba(1,8,20,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:2rem}
.podium-overlay.open{opacity:1;pointer-events:all}
.podium-card{background:rgba(3,14,30,.96);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-xl);padding:2.4rem 2rem 2rem;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.podium-title{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2);margin-bottom:2.2rem}
.podium-row{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-bottom:1.8rem}
.podium-col{display:flex;flex-direction:column;align-items:center;gap:.7rem;flex:1;min-width:0}
.podium-names{font-size:14px;font-weight:700;color:var(--text-1);min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35;word-break:break-word;padding:0 4px}
.podium-bar{width:100%;border-radius:var(--r-md) var(--r-md) 0 0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.podium-col.first .podium-bar{height:128px;background:linear-gradient(180deg,rgba(255,209,102,.4),rgba(255,209,102,.12));color:var(--gold);box-shadow:0 0 28px rgba(255,209,102,.35)}
.podium-col.second .podium-bar{height:96px;background:linear-gradient(180deg,rgba(212,226,255,.32),rgba(212,226,255,.1));color:var(--silver);box-shadow:0 0 20px rgba(212,226,255,.2)}
.podium-col.third .podium-bar{height:70px;background:linear-gradient(180deg,rgba(255,159,94,.38),rgba(255,159,94,.12));color:var(--bronze);box-shadow:0 0 20px rgba(255,159,94,.3)}
.podium-close{background:rgba(255,255,255,.08);border:none;border-radius:50px;padding:11px 32px;color:var(--text-1);font-size:13px;letter-spacing:.1em;cursor:pointer;font-family:inherit;transition:background .15s}
.podium-close:hover{background:rgba(255,255,255,.15)}

/* responsive */
@media(max-width:640px){
  :root{--bar-h:172px}
  .page{padding:2rem 1rem;padding-bottom:calc(var(--bar-h) + 1.5rem)}
  .rank-col-head,.rank-row{grid-template-columns:46px 1fr 90px}
  .rch-scores,.cell-scores{display:none}
  .site-header{align-items:flex-start}
  .settle-btn{padding:8px 16px;font-size:11px}
  .bottom-bar{padding:.7rem 1rem}
  .bar-row{flex-direction:column;align-items:flex-start;gap:6px}
  .bar-label{min-width:0}
  .bar-circles{width:100%}
  .score-field{flex:0 0 78px}
  .modal-card{bottom:calc(var(--bar-h) + 12px)}
}
</style>
</head>
<body>
<div class="bg-canvas"></div>

<div class="page">
  <!-- HEADER -->
  <header class="site-header">
    <div class="title-block">
      <div class="title-wrap">
        <h1 id="siteTitle" contenteditable="true" spellcheck="false" data-placeholder="Overall Rankings">Overall Rankings</h1>
        <span class="title-hint" onclick="focusTitle()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </span>
      </div>
      <div class="header-accent"></div>
    </div>
    <button class="settle-btn" onclick="openPodium()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/></svg>
      結算
    </button>
  </header>

  <!-- RANKING (display only) -->
  <div class="glass-card rank-card">
    <div class="rank-col-head">
      <div class="rch-rank">排名</div>
      <div>選手</div>
      <div class="rch-scores">評審分數</div>
      <div class="rch-avg">平均分數</div>
    </div>
    <div class="rank-list" id="rankList"></div>
  </div>

  <!-- EXPORT -->
  <div class="glass-card section-card">
    <p class="section-title" style="margin-bottom:1.1rem">匯出</p>
    <div class="export-row">
      <button class="add-row-btn" onclick="exportHTML()">匯出 HTML</button>
      <button class="add-row-btn" onclick="exportJPG()">匯出 JPG</button>
    </div>
  </div>
</div>

<!-- ATHLETE EDIT MODAL -->
<div class="modal-overlay" id="athleteModalOverlay" onclick="closeAthleteModal()"></div>
<div class="modal-card" id="athleteModal">
  <div class="modal-head">
    <input class="modal-name-input" id="modalNameInput" placeholder="選手姓名"/>
    <button class="modal-close" onclick="closeAthleteModal()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="score-input-row" id="modalScoreGrid"></div>
  </div>
  <div class="modal-foot">
    <button class="submit-btn" onclick="submitAthleteModal()">提交</button>
  </div>
</div>

<!-- PODIUM -->
<div class="podium-overlay" id="podiumOverlay" onclick="closePodium(event)">
  <div class="podium-card">
    <p class="podium-title">🏆 Final Results</p>
    <div class="podium-row" id="podiumRow"></div>
    <button class="podium-close" onclick="closePodium()">關閉</button>
  </div>
</div>

<!-- BOTTOM ROSTER BAR -->
<div class="bottom-bar">
  <div class="bar-row">
    <div class="bar-label">
      <span class="bar-label-text">選手</span>
      <div class="stepper">
        <button onclick="adjustAthletes(-1)">−</button>
        <span id="athleteCount">10</span>
        <button onclick="adjustAthletes(1)">＋</button>
      </div>
    </div>
    <div class="bar-circles" id="athleteCircles"></div>
  </div>
  <div class="bar-row">
    <div class="bar-label">
      <span class="bar-label-text">評審</span>
      <div class="stepper">
        <button onclick="adjustJudges(-1)">−</button>
        <span id="judgeCount">10</span>
        <button onclick="adjustJudges(1)">＋</button>
      </div>
    </div>
    <div class="bar-circles" id="judgeCircles"></div>
  </div>
</div>

<script>
let judges = ['評審 1','評審 2','評審 3','評審 4','評審 5','評審 6','評審 7','評審 8','評審 9','評審 10'];
let athletes = Array.from({length:10},(_,i)=>({id:i+1,name:'EPM '+(i+1),scores:Array(10).fill(null)}));
let nextId = 11;
let activeAthleteId = null;

/* ── SCORING ── */
function avg(s){
  const valid=s.filter(x=>x!==null&&x!==undefined);
  if(!valid.length) return null;
  if(valid.length<=2) return valid.reduce((a,b)=>a+b,0)/valid.length;
  const sorted=[...valid].sort((a,b)=>a-b);
  const trimmed=sorted.slice(1,-1);
  return trimmed.reduce((a,b)=>a+b,0)/trimmed.length;
}
/* indices of scores excluded from the average (one min + one max), when >2 valid scores */
function trimmedIndices(s){
  const valid=s.map((x,i)=>({x,i})).filter(o=>o.x!==null&&o.x!==undefined);
  if(valid.length<=2) return new Set();
  let minO=valid[0],maxO=valid[0];
  valid.forEach(o=>{ if(o.x<minO.x) minO=o; if(o.x>maxO.x) maxO=o; });
  return new Set(minO.i===maxO.i ? [minO.i] : [minO.i,maxO.i]);
}

/* sorted athletes with competition ranking (ties share a rank, next rank skips) */
function getRanked(){
  const sorted=[...athletes].sort((a,b)=>{
    const aa=avg(a.scores),ba=avg(b.scores);
    if(aa===null&&ba===null) return a.id-b.id;
    if(aa===null) return 1;
    if(ba===null) return -1;
    return ba-aa;
  });
  const ranks=[];
  sorted.forEach((a,i)=>{
    const av=avg(a.scores);
    if(av!==null && i>0){
      const prevAv=avg(sorted[i-1].scores);
      if(prevAv!==null && Math.abs(av-prevAv)<0.005){ ranks.push(ranks[i-1]); return; }
    }
    ranks.push(i+1);
  });
  return sorted.map((a,i)=>({athlete:a,rank:ranks[i],avg:avg(a.scores)}));
}

/* title */
function focusTitle(){
  const t=document.getElementById('siteTitle');
  t.focus();
  const range=document.createRange();
  range.selectNodeContents(t);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
document.getElementById('siteTitle').addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault();});
document.getElementById('siteTitle').addEventListener('paste',e=>{
  e.preventDefault();
  document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text').replace(/\n/g,' '));
});

/* ── RANKING (display only) ── */
function badgeCls(r){return r===1?'rb-gold':r===2?'rb-silver':r===3?'rb-bronze':'rb-other'}

function renderRanking(){
  const ranked=getRanked();
  const list=document.getElementById('rankList');
  if(!ranked.length){list.innerHTML='<div class="rank-empty">尚未新增選手</div>';return;}
  list.innerHTML=ranked.map(({athlete:a,rank:r,avg:av})=>{
    const bc=badgeCls(r);
    const trimmed=trimmedIndices(a.scores);
    const scoreItems=a.scores.map((sc,j)=>`
      <div class="score-item${trimmed.has(j)?' trimmed':''}">
        <span class="score-val${sc===null||sc===undefined?' empty':''}">${sc!==null&&sc!==undefined?sc.toFixed(1):'—'}</span>
      </div>`).join('');
    const avgHtml=av!==null
      ?`<span class="avg-num">${av.toFixed(2)}</span><span class="avg-denom"> / 10</span>`
      :`<span class="avg-num zero">—</span>`;
    return `
    <div class="rank-row">
      <div class="cell-rank"><div class="rank-badge ${bc}">${r}</div></div>
      <div class="cell-name">${a.name}</div>
      <div class="cell-scores"><div class="score-group">${scoreItems}</div></div>
      <div class="cell-avg">${avgHtml}</div>
    </div>`;
  }).join('');
}

/* ── BOTTOM BAR ── */
function renderBar(){
  document.getElementById('athleteCount').textContent=athletes.length;
  document.getElementById('judgeCount').textContent=judges.length;
  document.getElementById('athleteCircles').innerHTML=athletes.map((a,i)=>
    `<div class="circle athlete" onclick="openAthleteModal(${a.id})">${i+1}</div>`).join('');
  document.getElementById('judgeCircles').innerHTML=judges.map((j,i)=>
    `<div class="circle">${i+1}</div>`).join('');
}

/* ── ATHLETE MODAL ── */
function openAthleteModal(id){
  activeAthleteId=id;
  const a=athletes.find(x=>x.id===id);
  if(!a) return;
  document.getElementById('modalNameInput').value=a.name;
  document.getElementById('modalScoreGrid').innerHTML=judges.map((j,i)=>`
    <div class="score-field">
      <span class="score-field-label">${j}</span>
      <input class="score-field-input" id="mf_${i}" type="number"
        value="${a.scores[i]!==null&&a.scores[i]!==undefined?a.scores[i]:''}"
        placeholder="0.0" min="0" max="10" step="0.1"/>
    </div>`).join('');
  document.getElementById('athleteModalOverlay').classList.add('open');
  document.getElementById('athleteModal').classList.add('open');
}
function closeAthleteModal(){
  activeAthleteId=null;
  document.getElementById('athleteModalOverlay').classList.remove('open');
  document.getElementById('athleteModal').classList.remove('open');
}
function submitAthleteModal(){
  const a=athletes.find(x=>x.id===activeAthleteId);
  if(!a) return;
  const name=document.getElementById('modalNameInput').value.trim();
  if(name) a.name=name;
  judges.forEach((_,i)=>{
    const el=document.getElementById('mf_'+i);
    if(!el) return;
    const raw=el.value.trim();
    if(raw===''){a.scores[i]=null;}
    else{const v=parseFloat(raw);a.scores[i]=isNaN(v)?null:Math.min(10,Math.max(0,v));}
  });
  renderRanking();
  closeAthleteModal();
}

/* ── ADJUST COUNTS ── */
function adjustJudges(delta){
  if(delta>0){
    judges.push('評審 '+(judges.length+1));
    athletes.forEach(a=>a.scores.push(null));
  }else{
    if(judges.length<=1){alert('至少需要一位評審');return;}
    judges.pop();
    athletes.forEach(a=>a.scores.pop());
  }
  renderRanking();renderBar();
}
function adjustAthletes(delta){
  if(delta>0){
    athletes.push({id:nextId++,name:'EPM '+(athletes.length+1),scores:judges.map(()=>null)});
  }else{
    if(athletes.length<=1){alert('至少需要一位選手');return;}
    const removed=athletes.pop();
    if(activeAthleteId===removed.id) closeAthleteModal();
  }
  renderRanking();renderBar();
}

/* ── PODIUM ── */
function openPodium(){
  const ranked=getRanked();
  const groups={};
  ranked.forEach(({athlete:a,rank:r})=>{
    if(r<=3) (groups[r]=groups[r]||[]).push(a.name);
  });
  const order=[2,1,3].filter(r=>groups[r]);
  const cls={1:'first',2:'second',3:'third'};
  const icon={1:'🥇',2:'🥈',3:'🥉'};
  document.getElementById('podiumRow').innerHTML=order.map(r=>`
    <div class="podium-col ${cls[r]}">
      <div class="podium-names">${groups[r].join('<br>')}</div>
      <div class="podium-bar">${icon[r]}</div>
    </div>`).join('');
  document.getElementById('podiumOverlay').classList.add('open');
}
function closePodium(e){
  if(e && e.target!==e.currentTarget) return;
  document.getElementById('podiumOverlay').classList.remove('open');
}

/* ── EXPORT ── */
function exportHTML(){
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  html=html.replace(/let judges = \[[^\]]*\];/,'let judges = '+JSON.stringify(judges)+';');
  html=html.replace(/let athletes = .*?;(\s*\nlet nextId)/s,'let athletes = '+JSON.stringify(athletes)+';$1');
  html=html.replace(/let nextId = \d+;/,'let nextId = '+nextId+';');
  html=html.replace(/class="modal-overlay open"/,'class="modal-overlay"');
  html=html.replace(/class="modal-card open"/,'class="modal-card"');
  html=html.replace(/class="podium-overlay open"/,'class="podium-overlay"');

  const blob=new Blob([html],{type:'text/html'});
  const link=document.createElement('a');
  link.download=(document.getElementById('siteTitle').textContent.trim()||'ranking')+'.html';
  link.href=URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){resolve();return;}
    const s=document.createElement('script');
    s.src=src;s.onload=resolve;s.onerror=reject;
    document.head.appendChild(s);
  });
}
async function exportJPG(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const bar=document.querySelector('.bottom-bar');
  const page=document.querySelector('.page');
  closeAthleteModal();
  document.getElementById('podiumOverlay').classList.remove('open');
  const prevBarDisplay=bar.style.display;
  const prevPagePadding=page.style.paddingBottom;
  bar.style.display='none';
  page.style.paddingBottom='2rem';
  await new Promise(r=>setTimeout(r,80));
  const canvas=await html2canvas(page,{
    backgroundColor:'#020a14',
    scale:2,
    width:page.scrollWidth,
    height:page.scrollHeight,
    windowWidth:page.scrollWidth,
    windowHeight:page.scrollHeight
  });
  bar.style.display=prevBarDisplay;
  page.style.paddingBottom=prevPagePadding;
  const link=document.createElement('a');
  link.download=(document.getElementById('siteTitle').textContent.trim()||'ranking')+'.jpg';
  link.href=canvas.toDataURL('image/jpeg',0.95);
  link.click();
}

renderRanking();
renderBar();
</script>
</body>
